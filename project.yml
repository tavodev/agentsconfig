name: AgentsConfig
options:
  bundleIdPrefix: com.tavodev
  createIntermediateGroups: true
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0
targets:
  AgentsConfig:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - AppIcon.icns
          - icon.png
        buildPhase: resources
      # third-party notices must ship inside the distributed bundle
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: AgentsConfig
        CFBundleDisplayName: AgentsConfig
        CFBundleIconFile: AppIcon.icns
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tavodev.agentsconfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_STRICT_CONCURRENCY: minimal
      # Debug gets its own identity so it never shares TCC grants or
      # UserDefaults with the installed Developer ID build.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tavodev.agentsconfig.debug
    dependencies:
      - package: TOMLKit
        product: TOMLKit
      - package: Yams
        product: Yams
  # Hostless logic tests: the app sources are compiled into the test bundle
  # (minus the @main entry point), so `xcodebuild test` never launches the app
  # — no real-home scan, no watchers on personal paths, no notifications.
  AgentsConfigTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - AgentsConfigApp.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tavodev.agentsconfig.tests
        PRODUCT_MODULE_NAME: AgentsConfigTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: TOMLKit
        product: TOMLKit
      - package: Yams
        product: Yams
  # Separate bundle identity prevents UI tests from terminating a user's app.
  AgentsConfigUITestHost:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - AppIcon.icns
          - icon.png
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tavodev.agentsconfig.ui-fixture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentsConfig UI Fixture
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: TOMLKit
        product: TOMLKit
      - package: Yams
        product: Yams
  AgentsConfigUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tavodev.agentsconfig.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: AgentsConfigUITestHost
    dependencies:
      - target: AgentsConfigUITestHost
schemes:
  AgentsConfig:
    build:
      targets:
        AgentsConfig: all
        AgentsConfigTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AgentsConfigTests
          parallelizable: false
  AgentsConfigUI:
    build:
      targets:
        AgentsConfigUITestHost: all
        AgentsConfigUITests: [test]
    test:
      config: Debug
      targets:
        - name: AgentsConfigUITests
          parallelizable: false
